name: Logic tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_translation_flow.py
      - run: python -m unittest discover -s tests -p test_transcript_history.py
      - run: python tests/test_transcript_persistence.py
      - run: python -m unittest discover -s tests -p test_distribution.py
      - run: python -m pip install numpy==2.4.6
      - run: python -m unittest discover -s tests -p test_audio_archive.py
